port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090

# DNS 配置（防污染与国内外分流解析）
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# 策略组
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🛡️ 故障转移
      - 🔀 负载均衡
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇰🇷 韩国节点
      - 🇺🇸 美国节点
      - 🇸🇬 新加坡节点
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🛡️ 故障转移
    type: fallback
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🔀 负载均衡
    type: load-balance
    include-all: true
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    filter: "(?i)(港|HK|Hong Kong|🇭🇰)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇹🇼 台湾节点
    type: url-test
    include-all: true
    filter: "(?i)(台|TW|Taiwan|🇹🇼)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    filter: "(?i)(日|JP|Japan|🇯🇵)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇰🇷 韩国节点
    type: url-test
    include-all: true
    filter: "(?i)(韩|KR|Korea|🇰🇷)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇺🇸 美国节点
    type: url-test
    include-all: true
    filter: "(?i)(美|US|United States|America|🇺🇸)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇸🇬 新加坡节点
    type: url-test
    include-all: true
    filter: "(?i)(新|SG|Singapore|🇸🇬)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🌍 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇸🇬 新加坡节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - DIRECT

  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - 🇸🇬 新加坡节点
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - 🇺🇸 美国节点

  - name: 📢 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🎯 兜底分流
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

# Loyalsoldier/clash-rules 官方完整规则集（去重精简版）
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
